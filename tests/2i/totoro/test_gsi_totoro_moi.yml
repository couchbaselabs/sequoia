- include: tests/templates/kv.yml, tests/templates/n1ql.yml, tests/templates/rebalance.yml, tests/templates/multinode_failure.yml, tests/templates/bucket.yml

############### Sleep for 5 mins before changing indexer settings ################
- image: sequoiatools/cmd
  entrypoint: sleep
  command: "300"
  requires: "{{eq true .DoOnce }}"
  wait: true

############### Enable stuck rebalance alerts ################
- image:  appropriate/curl
  command: "-X POST -u {{.RestUsername}}:{{.RestPassword}} -H Content-Type:application/json http://{{.Orchestrator}}:8091/settings/alerts -d '{ \"enabled\": true, \"pop_up_alerts\": [\"stuck_rebalance\"]}'"
  wait: true

############### Set num_replica ################
- template: set_gsi_config
  args: "{{.ActiveIndexNode 0}}, 'indexer.settings.num_replica':1"
  requires: "{{eq true .DoOnce }}"


############### Enable scan report ################
- template: set_gsi_config
  args: "{{.ActiveIndexNode 0}}, 'indexer.settings.generateScanReport':true"
  requires:  "{{eq true .DoOnce }}"

############### Backup any corrupted index data files ################
- template: set_gsi_config
  args: "{{.ActiveIndexNode 0}}, 'indexer.settings.enable_corrupt_index_backup':true"
  requires: "{{eq true .DoOnce }}"

############### Disable workaround for MB-46650 ################
- template: set_gsi_config
  args: "{{.ActiveIndexNode 0}}, 'indexer.plasma.recovery.enableFullReplayOnError':false"
  requires: "{{eq true .DoOnce }}"

############### Enable GSI Redistribution of indexes on rebalance in ################
- template: set_gsi_config
  args: "{{.ActiveIndexNode 0}}, 'indexer.settings.rebalance.redistribute_indexes':true"
  requires: "{{eq true .DoOnce }}"


############### Enable AWR and AUS ################
- image: sequoiatools/query_manager:dev
  command: "--connection_string {{.Orchestrator}} --username {{.RestUsername}} --password {{.RestPassword}} --action set_awr_aus --bucket_list {{.NthBucket 8}} --use_tls false"

############### create scopes and collections across 3 buckets as scope_1,scope_2 ... ###############
- image: sequoiatools/collections:1.0
  command: "-i {{.Orchestrator}}:8091 -b {{.Bucket}} -o create_multi_scope_collection -s scope_ -c coll_ --scope_count=1 --collection_count=1 --collection_distribution=uniform"
  requires: "{{eq true .DoOnce }}"
  wait: true
- command: "-i {{.Orchestrator}}:8091 -b {{.NthBucket 1}} -o create_multi_scope_collection -s scope_ -c coll_ --scope_count=1 --collection_count=1 --collection_distribution=uniform"
  requires: "{{eq true .DoOnce }}"
  wait: true
- command: "-i {{.Orchestrator}}:8091 -b {{.NthBucket 2}} -o create_multi_scope_collection -s scope_ -c coll_ --scope_count=3 --collection_count=15 --collection_distribution=uniform"
  requires: "{{eq true .DoOnce }}"
  wait: true
- command: "-i {{.Orchestrator}}:8091 -b {{.NthBucket 3}} -o create_multi_scope_collection -s scope_ -c coll_ --scope_count=1 --collection_count=1 --collection_distribution=uniform"
  requires: "{{eq true .DoOnce }}"
  wait: true
- command: "-i {{.Orchestrator}}:8091 -b {{.NthBucket 8}} -o create_multi_scope_collection -s scope_ -c coll_ --scope_count=1 --collection_count=1 --collection_distribution=uniform"
  requires: "{{eq true .DoOnce }}"
  wait: true

# Sleep for some time to allow collections manifest to sync
- image: sequoiatools/cmd
  entrypoint: sleep
  command: "300"
  requires: "{{eq true .DoOnce }}"
  wait: true

############### initial data loading ################
- image: sequoiatools/magmaloader
  command: "--host {{.Orchestrator}} --user Administrator --password password --bucket {{.Bucket}} --start 0  --end 10000 --doc_template Hotel --all_coll true"
  requires: "{{eq true .DoOnce }}"
  wait: true
- command: "--host {{.Orchestrator}} --user Administrator --password password --bucket {{.NthBucket 1}} --start 0  --end 10000 --doc_template Hotel --all_coll true"
  requires: "{{eq true .DoOnce }}"
  wait: true
- command: "--host {{.Orchestrator}} --user Administrator --password password --bucket {{.NthBucket 5}} --start 0  --end 1000000 --doc_template Hotel --all_coll true"
  requires: "{{eq true .DoOnce }}"
- command: "--host {{.Orchestrator}} --user Administrator --password password --bucket {{.NthBucket 6}} --start 0  --end 1000000 --doc_template Hotel --all_coll true"
  requires: "{{eq true .DoOnce }}"
- command: "--host {{.Orchestrator}} --user Administrator --password password --bucket {{.NthBucket 9}} --start 0  --end 1000000 --doc_template Hotel --all_coll true"
  requires: "{{eq true .DoOnce }}"

############### data loading bucket6, bucket9 (5M hotel docs) ################
- command: "--host {{.Orchestrator}} --user Administrator --password password --bucket {{.NthBucket 7}} --start 0  --end 5000000 --doc_template Hotel --all_coll true"
  requires: "{{eq true .DoOnce }}"

- command: "--host {{.Orchestrator}} --user Administrator --password password --bucket {{.NthBucket 4}} --start 0  --end 5000000 --doc_template Hotel --all_coll true"
  requires: "{{eq true .DoOnce }}"

###############  create indexes ################
- section_start: create_replica_indexes

###############  Indexer Random Recovery ################
- image: sequoiatools/indexmanager
  command: "-n {{.Orchestrator}} -o {{.RestPort}} -u {{.RestUsername}} -p {{.RestPassword}} -b {{.Bucket}} -a random_recovery --timeout {{.Scale 1200}} --interval 300"
  alias: random_recovery

###############  build all deferred indexes ################

- image: sequoiatools/indexmanager
  command: "-n {{.Orchestrator}} -o {{.RestPort}} -u {{.RestUsername}} -p {{.RestPassword}} -b {{.Bucket}} -a build_deferred_index -m 5"
  wait: true


# Enable CBO and Update Statistics for indexes on some collections
- image: sequoiatools/indexmanager
  command: "-n {{.Orchestrator}} -o {{.RestPort}} -u {{.RestUsername}} -p {{.RestPassword}} -b {{.Bucket}} -a enable_cbo --cbo_enable_ratio=50"
  alias: cbo_bucket1

# Sleep for some time to allow update statistics to run
- image: sequoiatools/cmd
  entrypoint: sleep
  command: "60"
  wait: true

- image: sequoiatools/indexmanager
  command: "-n {{.Orchestrator}} -o {{.RestPort}} -u {{.RestUsername}} -p {{.RestPassword}} -b {{.NthBucket 1}} -a enable_cbo --cbo_enable_ratio=50"
  alias: cbo_bucket2

# Sleep for some time to allow update statistics to run
- image: sequoiatools/cmd
  entrypoint: sleep
  command: "60"
  wait: true

# Sleep for some time to allow update statistics to run
- image: sequoiatools/cmd
  entrypoint: sleep
  command: "600"
  wait: true

# Create N1QL UDF Library and function - do it once per test
- image: sequoiatools/query_manager:dev
  command: "--connection_string {{.Nodes | .Service `n1ql` | net 0}} --username {{.RestUsername}} --password {{.RestPassword}} --action create_n1ql_udf --lib_name n1qludf --lib_filename n1ql_udf.js --use_tls false"
  requires: "{{eq true .DoOnce }}"
  wait: true

############### Create mixed SQL++/JS UDFs on bucket12 ###############
- image: sequoiatools/query_manager:dev
  command: "--connection_string {{.Nodes | .Service `n1ql` | net 0}} --username {{.RestUsername}} --password {{.RestPassword}} --bucket_list {{.NthBucket 9}} --action create_udf --num_udf_per_scope 5 --use_tls false"
  requires: "{{eq true .DoOnce }}"
  wait: true

############### incremental data loading ################
- image: sequoiatools/magmaloader
  command: "--host {{.Orchestrator}} --user Administrator --password password --bucket {{.Bucket}} --start 10000  --end 1000000 --doc_template Hotel --all_coll true"
  requires: "{{eq true .DoOnce }}"
- command: "--host {{.Orchestrator}} --user Administrator --password password --bucket {{.NthBucket 1}} --start 10000  --end 1000000 --doc_template Hotel --all_coll true"
  requires: "{{eq true .DoOnce }}"
- command: "--host {{.Orchestrator}} --user Administrator --password password --bucket {{.NthBucket 3}} --start 10000  --end 100000 --doc_template Hotel --all_coll true"
  requires: "{{eq true .DoOnce }}"

- image: sequoiatools/cmd
  entrypoint: sleep
  command: "1800"
  wait: true


###############  create indexes (batch 1: bucket1, bucket2, bucket12, bucket3, bucket7) ################
- section_start: create_replica_indexes
- image: sequoiatools/indexmanager
  command: "-n {{.Orchestrator}} -o {{.RestPort}} -u {{.RestUsername}} -p {{.RestPassword}} --bucket_list {{.Bucket}} -i {{.Scale 1}} -a create_n_indexes_on_buckets --set_max_partitions 24 -v --num_of_indexes_per_bucket 13 --skip_default_collection true"
  wait: true
- command: "-n {{.Orchestrator}} -o {{.RestPort}} -u {{.RestUsername}} -p {{.RestPassword}} --bucket_list {{.NthBucket 1}} -i {{.Scale 1}} -a create_n_indexes_on_buckets --set_max_partitions 24 -v --num_of_indexes_per_bucket 13 --skip_default_collection true --set_max_replicas 1"
  wait: true
- command: "-n {{.Orchestrator}} -o {{.RestPort}} -u {{.RestUsername}} -p {{.RestPassword}} --bucket_list {{.NthBucket 9}} -i {{.Scale 1}} -a create_n_indexes_on_buckets --set_max_partitions 24 -v --num_of_indexes_per_bucket 13 --skip_default_collection false --set_max_replicas 0"
  wait: true
- command: "-n {{.Orchestrator}} -o {{.RestPort}} -u {{.RestUsername}} -p {{.RestPassword}} --bucket_list {{.NthBucket 2}} -i {{.Scale 1}} -a create_n_indexes_on_buckets --set_max_partitions 24 -v --num_of_indexes_per_bucket 13 --skip_default_collection false --set_max_replicas 1"
  wait: true
############### bucket7 scalar indexes ################
- command: "-n {{.Orchestrator}} -o {{.RestPort}} -u {{.RestUsername}} -p {{.RestPassword}} --bucket_list {{.NthBucket 5}} -i {{.Scale 1}} -a create_n_indexes_on_buckets --set_max_partitions 24 -v --num_of_indexes_per_bucket 13 --skip_default_collection false --set_max_replicas 1"
  wait: true

############### build + wait paired with the batch just created (bucket1, bucket2, bucket12, bucket3, bucket7) - create_n_indexes_on_buckets randomly defers ~50% of indexes even without --defer_build, so build_deferred_index must be issued for every bucket just created before the wait, or the wait can hang on indexes nobody told to build ################
- image: sequoiatools/indexmanager
  command: "-n {{.Orchestrator}} -o {{.RestPort}} -u {{.RestUsername}} -p {{.RestPassword}} -b {{.Bucket}} -a build_deferred_index -m 5"
  wait: true
- command: "-n {{.Orchestrator}} -o {{.RestPort}} -u {{.RestUsername}} -p {{.RestPassword}} -b {{.NthBucket 1}} -a build_deferred_index -m 5"
  wait: true
- command: "-n {{.Orchestrator}} -o {{.RestPort}} -u {{.RestUsername}} -p {{.RestPassword}} -b {{.NthBucket 9}} -a build_deferred_index -m 5"
  wait: true
- command: "-n {{.Orchestrator}} -o {{.RestPort}} -u {{.RestUsername}} -p {{.RestPassword}} -b {{.NthBucket 2}} -a build_deferred_index -m 5"
  wait: true
- command: "-n {{.Orchestrator}} -o {{.RestPort}} -u {{.RestUsername}} -p {{.RestPassword}} -b {{.NthBucket 5}} -a build_deferred_index -m 5"
  wait: true
- image: sequoiatools/wait_for_idx_build_complete
  command: "{{.ActiveIndexNode 0}} {{.RestUsername}} {{.RestPassword}}"
  wait: true

###############  create indexes (batch 2: bucket9, bucket6 (5M hotel), bucket8) ################
- section_start: create_replica_indexes
- image: sequoiatools/indexmanager
  command: "-n {{.Orchestrator}} -o {{.RestPort}} -u {{.RestUsername}} -p {{.RestPassword}} --bucket_list {{.NthBucket 7}} -i {{.Scale 1}} -a create_n_indexes_on_buckets --set_max_partitions 24 -v --num_of_indexes_per_bucket 13 --skip_default_collection false --set_max_replicas 1"
  wait: true
- command: "-n {{.Orchestrator}} -o {{.RestPort}} -u {{.RestUsername}} -p {{.RestPassword}} --bucket_list {{.NthBucket 4}} -i {{.Scale 1}} -a create_n_indexes_on_buckets --set_max_partitions 24 -v --num_of_indexes_per_bucket 13 --skip_default_collection false --set_max_replicas 1"
  wait: true
- command: "-n {{.Orchestrator}} -o {{.RestPort}} -u {{.RestUsername}} -p {{.RestPassword}} --bucket_list {{.NthBucket 6}} -i {{.Scale 1}} -a create_n_indexes_on_buckets --set_max_partitions 24 -v --num_of_indexes_per_bucket 13 --skip_default_collection false --set_max_replicas 1"
  wait: true

############### build + wait paired with the batch just created (bucket9, bucket6, bucket8) ################
- image: sequoiatools/indexmanager
  command: "-n {{.Orchestrator}} -o {{.RestPort}} -u {{.RestUsername}} -p {{.RestPassword}} -b {{.Bucket}} -a build_deferred_index -m 5"
  wait: true
- command: "-n {{.Orchestrator}} -o {{.RestPort}} -u {{.RestUsername}} -p {{.RestPassword}} -b {{.NthBucket 7}} -a build_deferred_index -m 5"
  wait: true
- command: "-n {{.Orchestrator}} -o {{.RestPort}} -u {{.RestUsername}} -p {{.RestPassword}} -b {{.NthBucket 4}} -a build_deferred_index -m 5"
  wait: true
- command: "-n {{.Orchestrator}} -o {{.RestPort}} -u {{.RestUsername}} -p {{.RestPassword}} -b {{.NthBucket 6}} -a build_deferred_index -m 5"
  wait: true
- command: "-n {{.Orchestrator}} -o {{.RestPort}} -u {{.RestUsername}} -p {{.RestPassword}} -b {{.NthBucket 9}} -a build_deferred_index -m 5"
  wait: true
- image: sequoiatools/wait_for_idx_build_complete
  command: "{{.ActiveIndexNode 0}} {{.RestUsername}} {{.RestPassword}}"
  wait: true

# Sleep for some more time after memcached-kill completes (10 minutes)
- image: sequoiatools/cmd
  entrypoint: sleep
  command: "602"
  wait: true

- client:
    op: rm
    container: random_recovery

############### Kill memcached (every bucket created above already has its build_deferred_index/wait paired in, so this chaos no longer needs its own build_deferred_index steps interleaved) ################
- template: kill_process
  args: "{{.NthDataNode 3}}, memcached"


# Sleep for some more time after memcached-kill completes (10 minutes)
- image: sequoiatools/cmd
  entrypoint: sleep
  command: "212"
  wait: true

############## Random stream repair induced ################
- template: kill_process
  args: "{{.NthDataNode 0}}, projector"

# Sleep for some more time after projector-kill completes (10 minutes)
- image: sequoiatools/cmd
  entrypoint: sleep
  command: "63"
  wait: true

############## Kill memcached ################
- template: kill_process
  args: "{{.NthDataNode 2}}, memcached"

# Sleep for some more time after memcached-kill completes (10 minutes)
- image: sequoiatools/cmd
  entrypoint: sleep
  command: "1923"
  wait: true

############## Kill memcached ################
- template: kill_process
  args: "{{.NthDataNode 1}}, memcached"

# Sleep for some more time after memcached-kill completes (10 minutes)
- image: sequoiatools/cmd
  entrypoint: sleep
  command: "602"
  wait: true

# Confirm the cluster is still fully built and healthy after the chaos above (all builds were
# already paired with their own build_deferred_index/wait right after each create batch)
- image: sequoiatools/wait_for_idx_build_complete
  command: "{{.ActiveIndexNode 0}} {{.RestUsername}} {{.RestPassword}}"
  wait: true

############### Quiet period (~2h50m, --timeout 10192s): no workload, indexer killed on a random index node every 20 mins ################
##### The next step waits for the indexes to come back after the last kill.
- image: sequoiatools/indexmanager
  command: "-n {{.Orchestrator}} -o {{.RestPort}} -u {{.RestUsername}} -p {{.RestPassword}} -b {{.Bucket}} -a random_recovery --timeout 10192 --interval 1200"
  requires: "{{eq true .DoOnce }}"
  wait: true

- image: sequoiatools/wait_for_idx_build_complete
  command: "{{.ActiveIndexNode 0}} {{.RestUsername}} {{.RestPassword}}"
  requires: "{{eq true .DoOnce }}"
  wait: true

############### Report indexer warmup times (Indexer::NewIndexer Status Warmup -> Status Active) from indexer.log* on every index node ################
- image: sequoiatools/indexmanager
  command: "-n {{.Orchestrator}} -o {{.RestPort}} -u {{.RestUsername}} -p {{.RestPassword}} -b {{.Bucket}} -a report_indexer_warmup_times --log_level ERROR"
  requires: "{{eq true .DoOnce }}"
  # report_indexer_warmup_times always exits 1 on purpose so sequoia dumps the (compact) report to the console;
  # --log_level ERROR keeps indexmanager's startup logging out of that dump
  expect_error: true
  wait: true

############### Capture index count once all indexes are built (see logs/*capture_index_names* for the "Captured N index instances" line, or total_instances in the snapshot file) ################
- image: sequoiatools/indexmanager
  command: "-n {{.Orchestrator}} -o {{.RestPort}} -u {{.RestUsername}} -p {{.RestPassword}} -a capture_index_names --snapshot_file /data/index_snapshot_initial.json"
  volumes: "/data:/data"
  wait: true

######## Validate items count against KV #######################

######## Validate items count against KV #######################
- image: sequoiatools/indexmanager
  command: "-n {{.Orchestrator}} -o {{.RestPort}} -u {{.RestUsername}} -p {{.RestPassword}} -b {{.Bucket}} -a item_count_check --sample_size 5 --all_docs_indexed true"
  wait: true
- command: "-n {{.Orchestrator}} -o {{.RestPort}} -u {{.RestUsername}} -p {{.RestPassword}} -b {{.NthBucket 7}} -a item_count_check --sample_size 5 --all_docs_indexed true"
  wait: true
- command: "-n {{.Orchestrator}} -o {{.RestPort}} -u {{.RestUsername}} -p {{.RestPassword}} -b {{.NthBucket 4}} -a item_count_check --sample_size 5 --all_docs_indexed true"
  wait: true
- command: "-n {{.Orchestrator}} -o {{.RestPort}} -u {{.RestUsername}} -p {{.RestPassword}} -b {{.NthBucket 5}} -a item_count_check --sample_size 5 --all_docs_indexed true"
  wait: true
- command: "-n {{.Orchestrator}} -o {{.RestPort}} -u {{.RestUsername}} -p {{.RestPassword}} -b {{.NthBucket 6}} -a item_count_check --sample_size 5 --all_docs_indexed true"
  wait: true
- command: "-n {{.Orchestrator}} -o {{.RestPort}} -u {{.RestUsername}} -p {{.RestPassword}} -b {{.NthBucket 9}} -a item_count_check --sample_size 15 --all_docs_indexed true"
  wait: true

- image: sequoiatools/indexmanager
  command: "-n {{.Orchestrator}} -o {{.RestPort}} -u {{.RestUsername}} -p {{.RestPassword}} -b {{.NthBucket 1}} -a post_topology_change_validations"
  wait: true

############## Prepare scalar N1QL statements on bucket12 ###############
- image: sequoiatools/query_manager:dev
  command: "--connection_string {{.Nodes | .Service `n1ql` | net 0}} --username {{.RestUsername}} --password {{.RestPassword}} --bucket_list {{.NthBucket 9}} --action prepare_statements --statement_types scalar --use_tls false"
  requires: "{{eq true .DoOnce }}"
  wait: true

############### Set plan stability to prepared_only before running prepared queries ###############
- image: sequoiatools/query_manager:dev
  command: "--connection_string {{.Nodes | .Service `n1ql` | net 0}} --username {{.RestUsername}} --password {{.RestPassword}} --action set_plan_stability --plan_stability_mode prepared_only --use_tls false"
  wait: true

############## Execute scalar prepared statements - baseline validation ###############
- image: sequoiatools/query_manager:dev
  command: "--connection_string {{.Nodes | .Service `n1ql` | net 0}} --username {{.RestUsername}} --password {{.RestPassword}} --bucket_list {{.NthBucket 9}} --action execute_prepared --prepared_duration 50 --prepared_interval 1 --validate_prepared true --statement_types scalar --use_tls false"
  wait: true

############### Verify QUERY_METADATA has records before switching to ad_hoc ###############
- image: sequoiatools/query_manager:dev
  command: "--connection_string {{.Nodes | .Service `n1ql` | net 0}} --username {{.RestUsername}} --password {{.RestPassword}} --action verify_query_metadata --non_zero_check true --use_tls false"
  wait: true

############### Plan stability quiet period - ad_hoc mode (10 mins) ###############
### WARNING: Keep query load minimal during this period to avoid OOM errors ###
- image: sequoiatools/query_manager:dev
  command: "--connection_string {{.Nodes | .Service `n1ql` | net 0}} --username {{.RestUsername}} --password {{.RestPassword}} --action set_plan_stability --plan_stability_mode ad_hoc --use_tls false"
  wait: true

############### Light query workload during ad_hoc mode - 1 concurrent query per bucket ###############
### Scalar queries on bucket1 ###
- image: sequoiatools/query_manager:dev
  command: "--connection_string {{.Orchestrator}} --username {{.RestUsername}} --password {{.RestPassword}} --action run_query_workload --duration 600 --refresh_duration 300 --timeout 600 --num_concurrent_queries 1 --use_sdk true --query_type n1ql --template hotel --bucket_list {{.Bucket}} --use_tls false"
  alias: plan_stability_adhoc_workload_1
### Scalar queries on bucket2 ###
- command: "--connection_string {{.Orchestrator}} --username {{.RestUsername}} --password {{.RestPassword}} --action run_query_workload --duration 600 --refresh_duration 300 --timeout 600 --num_concurrent_queries 1 --use_sdk true --query_type n1ql --template hotel --bucket_list {{.NthBucket 1}} --use_tls false"
  alias: plan_stability_adhoc_workload_2

############### Wait for ad_hoc workloads to complete ###############
- client:
    op: wait_for_containers
    container_alias: plan_stability_adhoc_workload_1, plan_stability_adhoc_workload_2

############### Verify QUERY_METADATA has records before switching to ad_hoc_read_only ###############
- image: sequoiatools/query_manager:dev
  command: "--connection_string {{.Nodes | .Service `n1ql` | net 0}} --username {{.RestUsername}} --password {{.RestPassword}} --action verify_query_metadata --non_zero_check true --use_tls false"
  wait: true

############### Plan stability quiet period - ad_hoc_read_only mode (10 mins) ###############
### WARNING: Keep query load minimal during this period to avoid OOM errors ###
- image: sequoiatools/query_manager:dev
  command: "--connection_string {{.Nodes | .Service `n1ql` | net 0}} --username {{.RestUsername}} --password {{.RestPassword}} --action set_plan_stability --plan_stability_mode ad_hoc_read_only --use_tls false"
  wait: true

############### Light query workload during ad_hoc_read_only mode - 1 concurrent query per bucket ###############
### Scalar queries on bucket1 ###
- image: sequoiatools/query_manager:dev
  command: "--connection_string {{.Orchestrator}} --username {{.RestUsername}} --password {{.RestPassword}} --action run_query_workload --duration 600 --refresh_duration 300 --timeout 600 --num_concurrent_queries 1 --use_sdk true --query_type n1ql --template hotel --bucket_list {{.Bucket}} --use_tls false"
  alias: plan_stability_adhoc_ro_workload_1
### Scalar queries on bucket2 ###
- command: "--connection_string {{.Orchestrator}} --username {{.RestUsername}} --password {{.RestPassword}} --action run_query_workload --duration 600 --refresh_duration 300 --timeout 600 --num_concurrent_queries 1 --use_sdk true --query_type n1ql --template hotel --bucket_list {{.NthBucket 1}} --use_tls false"
  alias: plan_stability_adhoc_ro_workload_2

############### Wait for ad_hoc_read_only workloads to complete ###############
- client:
    op: wait_for_containers
    container_alias: plan_stability_adhoc_ro_workload_1, plan_stability_adhoc_ro_workload_2

############### Verify QUERY_METADATA has records before restoring prepared_only ###############
- image: sequoiatools/query_manager:dev
  command: "--connection_string {{.Nodes | .Service `n1ql` | net 0}} --username {{.RestUsername}} --password {{.RestPassword}} --action verify_query_metadata --non_zero_check true --use_tls false"
  wait: true

############### Restore plan stability to prepared_only after quiet period ###############
- image: sequoiatools/query_manager:dev
  command: "--connection_string {{.Nodes | .Service `n1ql` | net 0}} --username {{.RestUsername}} --password {{.RestPassword}} --action set_plan_stability --plan_stability_mode prepared_only --use_tls false"
  wait: true

- image: sequoiatools/magmaloader
  command: "--host {{.Orchestrator}} --user Administrator --password password --bucket {{.Bucket}} --start 10000  --end 1000000 --doc_template Hotel --all_coll true --expiry_mode true --max_ttl 21600 --percentage_expiry 10 --ops_rate 1000"
  requires: "{{eq true .DoOnce }}"
- command: "--host {{.Orchestrator}} --user Administrator --password password --bucket {{.NthBucket 1}} --start 10000  --end 1000000 --doc_template Hotel --all_coll true --expiry_mode true --max_ttl 36000 --percentage_expiry 5 --ops_rate 1000"
  requires: "{{eq true .DoOnce }}"


# ###############  run queries ################
- section_start: query_indexes
- image: sequoiatools/query_manager:dev
