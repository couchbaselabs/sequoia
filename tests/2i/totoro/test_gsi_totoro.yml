############## Random stream repair induced ################
- template: kill_process
  args: "{{.NthDataNode 0}}, projector"

# Sleep for some more time after projector-kill completes (10 minutes)
- image: sequoiatools/cmd
  entrypoint: sleep
  command: "63"
  wait: true


############### Turn off plan stability before cleanup ###############
- image: sequoiatools/query_manager:dev
  command: "--connection_string {{.Nodes | .Service `n1ql` | net 0}} --username {{.RestUsername}} --password {{.RestPassword}} --action set_plan_stability --plan_stability_mode off --use_tls false"
  wait: true

############### Verify QUERY_METADATA is empty after turning off plan stability ###############
- image: sequoiatools/query_manager:dev
  command: "--connection_string {{.Nodes | .Service `n1ql` | net 0}} --username {{.RestUsername}} --password {{.RestPassword}} --action verify_query_metadata --non_zero_check false --use_tls false"
  wait: true

############### Drop UDFs and prepared statements - bucket12 ###############
- image: sequoiatools/query_manager:dev
  command: "--connection_string {{.Nodes | .Service `n1ql` | net 0}} --username {{.RestUsername}} --password {{.RestPassword}} --bucket_list {{.NthBucket 11}} --action drop_udf --use_tls false"
  wait: true
- command: "--connection_string {{.Nodes | .Service `n1ql` | net 0}} --username {{.RestUsername}} --password {{.RestPassword}} --action drop_prepared_statements --use_tls false"
  wait: true

###############  Drop all Indexes ################
- section_start: drop_all_indexes
- image: sequoiatools/indexmanager
  command: "-n {{.Orchestrator}} -o {{.RestPort}} -u {{.RestUsername}} -p {{.RestPassword}} -b {{.Bucket}}  -a drop_all_indexes -v"
  wait: true

- command: "-n {{.Orchestrator}} -o {{.RestPort}} -u {{.RestUsername}} -p {{.RestPassword}} -b {{.NthBucket 1}} -a drop_all_indexes -v"
  wait: true

