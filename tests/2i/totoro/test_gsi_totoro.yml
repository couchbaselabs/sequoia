  wait: true
- command: "-n {{.Orchestrator}} -o {{.RestPort}} -u {{.RestUsername}} -p {{.RestPassword}} -b {{.NthBucket 11}} -a build_deferred_index -m 5"
  wait: true
- image: sequoiatools/wait_for_idx_build_complete
  command: "{{.ActiveIndexNode 0}} {{.RestUsername}} {{.RestPassword}}"
  wait: true

############### bucket11 msmarco composite sparse indexes (non-default collection only - default is reserved for AWR/AUS) ################
- image: sequoiatools/indexmanager
  command: "-n {{.Orchestrator}} -o {{.RestPort}} -u {{.RestUsername}} -p {{.RestPassword}} --bucket_list {{.NthBucket 10}} -a create_n_indexes_on_buckets --timeout 30 --num_of_indexes_per_bucket 3 --create_sparse_vector_indexes true --dataset shoes --use_custom_keyspace scope_0.coll_0 --num_vectors 8841823 --defer_build true --set_max_replicas 1"
