- include: tests/templates/kv.yml, tests/templates/n1ql.yml, tests/templates/rebalance.yml, tests/templates/multinode_failure.yml, tests/templates/bucket.yml

############### Sleep for 5 mins before changing indexer settings ################
- image: sequoiatools/cmd
  entrypoint: sleep
  command: "300"
  requires: "{{eq true .DoOnce }}"
  wait: true

############### Enable Plasma Bloom Filter ################
- template: set_gsi_config
  args: "{{.ActiveIndexNode 0}}, 'indexer.plasma.backIndex.enablePageBloomFilter':true"
  requires: "{{eq true .DoOnce }}"

############### Enable breakpad ################
- template: set_gsi_config
  args: "{{.ActiveIndexNode 0}}, 'indexer.bhive.enableBreakPad':true"
  requires:  "{{eq true .DoOnce }}"

############### Enable stuck rebalance alerts ################
- image:  appropriate/curl
  command: "-X POST -u {{.RestUsername}}:{{.RestPassword}} -H Content-Type:application/json http://{{.Orchestrator}}:8091/settings/alerts -d '{ \"enabled\": true, \"pop_up_alerts\": [\"stuck_rebalance\"]}'"
  wait: true

############### Set num_replica ################
- template: set_gsi_config
  args: "{{.ActiveIndexNode 0}}, 'indexer.settings.num_replica':1"
  requires: "{{eq true .DoOnce }}"


############### Enable scan report ################
- template: set_gsi_config
  args: "{{.ActiveIndexNode 0}}, 'indexer.settings.generateScanReport':true"
  requires:  "{{eq true .DoOnce }}"

## Enable file-based rebalance
############### shardAffinity ################
- template: set_gsi_config
  args: "{{.ActiveIndexNode 0}}, 'indexer.settings.enable_shard_affinity':true"
  requires: "{{eq true .DoOnce }}"

## Enable file-based rebalance
############### shardAffinity ################
- template: set_gsi_config
  args: "{{.ActiveIndexNode 0}}, 'indexer.settings.provisioned.enable_shard_affinity':true"
  requires: "{{eq true .DoOnce }}"

############### Backup any corrupted index data files ################
- template: set_gsi_config
  args: "{{.ActiveIndexNode 0}}, 'indexer.settings.enable_corrupt_index_backup':true"
  requires: "{{eq true .DoOnce }}"

############### Disable workaround for MB-46650 ################
- template: set_gsi_config
  args: "{{.ActiveIndexNode 0}}, 'indexer.plasma.recovery.enableFullReplayOnError':false"
  requires: "{{eq true .DoOnce }}"

############### Enable GSI Redistribution of indexes on rebalance in ################
- template: set_gsi_config
  args: "{{.ActiveIndexNode 0}}, 'indexer.settings.rebalance.redistribute_indexes':true"
  requires: "{{eq true .DoOnce }}"


############### Enable AWR and AUS ################
- image: sequoiatools/query_manager:dev
  command: "--connection_string {{.Orchestrator}} --username {{.RestUsername}} --password {{.RestPassword}} --action set_awr_aus --bucket_list {{.NthBucket 10}} --use_tls false"

############### create scopes and collections across 3 buckets as scope_1,scope_2 ... ###############
- image: sequoiatools/collections:1.0
  command: "-i {{.Orchestrator}}:8091 -b {{.Bucket}} -o create_multi_scope_collection -s scope_ -c coll_ --scope_count=1 --collection_count=1 --collection_distribution=uniform"
  requires: "{{eq true .DoOnce }}"
  wait: true
- command: "-i {{.Orchestrator}}:8091 -b {{.NthBucket 1}} -o create_multi_scope_collection -s scope_ -c coll_ --scope_count=1 --collection_count=1 --collection_distribution=uniform"
  requires: "{{eq true .DoOnce }}"
  wait: true
- command: "-i {{.Orchestrator}}:8091 -b {{.NthBucket 2}} -o create_multi_scope_collection -s scope_ -c coll_ --scope_count=3 --collection_count=15 --collection_distribution=uniform"
  requires: "{{eq true .DoOnce }}"
  wait: true
- command: "-i {{.Orchestrator}}:8091 -b {{.NthBucket 3}} -o create_multi_scope_collection -s scope_ -c coll_ --scope_count=1 --collection_count=1 --collection_distribution=uniform"
  requires: "{{eq true .DoOnce }}"
  wait: true
- command: "-i {{.Orchestrator}}:8091 -b {{.NthBucket 4}} -o create_multi_scope_collection -s scope_ -c coll_ --scope_count=1 --collection_count=1 --collection_distribution=uniform"
  requires: "{{eq true .DoOnce }}"
  wait: true
- command: "-i {{.Orchestrator}}:8091 -b {{.NthBucket 9}} -o create_multi_scope_collection -s scope_ -c coll_ --scope_count=1 --collection_count=1 --collection_distribution=uniform"
  requires: "{{eq true .DoOnce }}"
  wait: true
############### bucket11's default collection is used for AWR/AUS - keep msmarco data in its own scope/collection ###############
- command: "-i {{.Orchestrator}}:8091 -b {{.NthBucket 10}} -o create_multi_scope_collection -s scope_ -c coll_ --scope_count=1 --collection_count=1 --collection_distribution=uniform"
  requires: "{{eq true .DoOnce }}"
  wait: true

# Sleep for some time to allow collections manifest to sync
- image: sequoiatools/cmd
  entrypoint: sleep
  command: "300"
  requires: "{{eq true .DoOnce }}"
  wait: true

############### initial data loading ################
- image: sequoiatools/magmaloader
  command: "--host {{.Orchestrator}} --user Administrator --password password --bucket {{.Bucket}} --start 0  --end 10000 --doc_template Hotel --all_coll true"
  requires: "{{eq true .DoOnce }}"
  wait: true
- command: "--host {{.Orchestrator}} --user Administrator --password password --bucket {{.NthBucket 1}} --start 0  --end 10000 --doc_template Hotel --all_coll true"
  requires: "{{eq true .DoOnce }}"
  wait: true
- command: "--host {{.Orchestrator}} --user Administrator --password password --bucket {{.NthBucket 6}} --start 0  --end 1000000 --doc_template Hotel --all_coll true"
  requires: "{{eq true .DoOnce }}"
- command: "--host {{.Orchestrator}} --user Administrator --password password --bucket {{.NthBucket 7}} --start 0  --end 1000000 --doc_template Hotel --all_coll true"
  requires: "{{eq true .DoOnce }}"
- command: "--host {{.Orchestrator}} --user Administrator --password password --bucket {{.NthBucket 11}} --start 0  --end 1000000 --doc_template Hotel --all_coll true"
  requires: "{{eq true .DoOnce }}"

############### data loading shoes dataset ################
- command: "--host {{.Orchestrator}} --user Administrator --password password --bucket {{.NthBucket 8}} --start 0  --end 50000000 --sift_path /root/bigann/ --all_coll true"
  volumes: "/data/bigann/:/root/bigann"
  requires: "{{eq true .DoOnce }}"

- command: "--host {{.Orchestrator}} --user Administrator --password password --bucket {{.NthBucket 5}} --start 0  --end 50000000 --sift_path /root/bigann/ --all_coll true"
  volumes: "/data/bigann/:/root/bigann"
  requires: "{{eq true .DoOnce }}"

############### data loading msmarco dataset (bucket11, full 8.8M corpus, own scope/collection - default collection is reserved for AWR/AUS) ################
# key_prefix must contain the dash: MSMARCOEmbeddingProduct.next() parses the doc key via
# key.split("-")[-1] to recover the numeric id - the default "doc" prefix has no dash and
# breaks with NumberFormatException (see DocLoader utils/val/MSMARCOEmbeddingProduct.java:169).
- command: "--host {{.Orchestrator}} --user Administrator --password password --bucket {{.NthBucket 10}} --start 0  --end 8841823 --msmarco_mode true --vec_file_path /data/sparse/collection.vecs --key_prefix msmarco- --scope scope_0 --collection coll_0"
  volumes: "/data/sparse/:/data/sparse"
  requires: "{{eq true .DoOnce }}"

############### data loading msmarco dataset (bucket5, same full 8.8M corpus, default collection only, for BHIVE sparse indexes) ################
- command: "--host {{.Orchestrator}} --user Administrator --password password --bucket {{.NthBucket 4}} --start 0  --end 8841823 --msmarco_mode true --vec_file_path /data/sparse/collection.vecs --key_prefix msmarco- --scope _default --collection _default"
  volumes: "/data/sparse/:/data/sparse"
  requires: "{{eq true .DoOnce }}"

###############  create indexes ################
- section_start: create_replica_indexes

###############  Indexer Random Recovery ################
- image: sequoiatools/indexmanager
  command: "-n {{.Orchestrator}} -o {{.RestPort}} -u {{.RestUsername}} -p {{.RestPassword}} -b {{.Bucket}} -a random_recovery --timeout {{.Scale 1200}} --interval 300"
  alias: random_recovery

###############  build all deferred indexes ################

- image: sequoiatools/indexmanager
  command: "-n {{.Orchestrator}} -o {{.RestPort}} -u {{.RestUsername}} -p {{.RestPassword}} -b {{.Bucket}} -a build_deferred_index -m 5"
  wait: true


# Enable CBO and Update Statistics for indexes on some collections
- image: sequoiatools/indexmanager
  command: "-n {{.Orchestrator}} -o {{.RestPort}} -u {{.RestUsername}} -p {{.RestPassword}} -b {{.Bucket}} -a enable_cbo --cbo_enable_ratio=50"
  alias: cbo_bucket1

# Sleep for some time to allow update statistics to run
- image: sequoiatools/cmd
  entrypoint: sleep
  command: "60"
  wait: true

- image: sequoiatools/indexmanager
  command: "-n {{.Orchestrator}} -o {{.RestPort}} -u {{.RestUsername}} -p {{.RestPassword}} -b {{.NthBucket 1}} -a enable_cbo --cbo_enable_ratio=50"
  alias: cbo_bucket2

# Sleep for some time to allow update statistics to run
- image: sequoiatools/cmd
  entrypoint: sleep
  command: "60"
  wait: true

# Sleep for some time to allow update statistics to run
- image: sequoiatools/cmd
  entrypoint: sleep
  command: "600"
  wait: true

# Create N1QL UDF Library and function - do it once per test
- image: sequoiatools/query_manager:dev
  command: "--connection_string {{.Nodes | .Service `n1ql` | net 0}} --username {{.RestUsername}} --password {{.RestPassword}} --action create_n1ql_udf --lib_name n1qludf --lib_filename n1ql_udf.js --use_tls false"
  requires: "{{eq true .DoOnce }}"
  wait: true

############### Create mixed SQL++/JS UDFs on bucket12 ###############
- image: sequoiatools/query_manager:dev
  command: "--connection_string {{.Nodes | .Service `n1ql` | net 0}} --username {{.RestUsername}} --password {{.RestPassword}} --bucket_list {{.NthBucket 11}} --action create_udf --num_udf_per_scope 5 --use_tls false"
  requires: "{{eq true .DoOnce }}"
  wait: true

############### incremental data loading ################
- image: sequoiatools/magmaloader
  command: "--host {{.Orchestrator}} --user Administrator --password password --bucket {{.Bucket}} --start 10000  --end 1000000 --doc_template Hotel --all_coll true"
  requires: "{{eq true .DoOnce }}"
- command: "--host {{.Orchestrator}} --user Administrator --password password --bucket {{.NthBucket 1}} --start 10000  --end 1000000 --doc_template Hotel --all_coll true"
  requires: "{{eq true .DoOnce }}"
- command: "--host {{.Orchestrator}} --user Administrator --password password --bucket {{.NthBucket 3}} --start 10000  --end 100000 --doc_template Hotel --all_coll true"
  requires: "{{eq true .DoOnce }}"

- image: sequoiatools/cmd
  entrypoint: sleep
  command: "1800"
  wait: true

############ upsert vector embeddings ################
- image: sequoiatools/siftloader
  command: "--connection_string {{.Orchestrator}} --username Administrator --password password --bucket {{.Bucket}} --start 0 --end 1000000 --batch_size 100000 --file_path /sift_base.fvecs --load_in_chunks false"
  alias: vector_mutations_1
- command: "--connection_string {{.Orchestrator}} --username Administrator --password password --bucket {{.Bucket}} --start 0 --end 1000000 --batch_size 100000 --file_path /sift_base.fvecs --load_in_chunks false --scope scope_0 --collection coll_0"
  alias: vector_mutations_4
- command: "--connection_string {{.Orchestrator}} --username Administrator --password password --bucket {{.NthBucket 3}} --start 1 --end 10000 --batch_size 1000 --file_path /sift_base.fvecs --load_in_chunks false"
  alias: vector_mutations_1
- command: "--connection_string {{.Orchestrator}} --username Administrator --password password --bucket {{.NthBucket 3}} --start 1 --end 10000 --batch_size 1000 --file_path /sift_base.fvecs --load_in_chunks false --scope scope_0 --collection coll_0"
  alias: vector_mutations_4
- command: "--connection_string {{.Orchestrator}} --username Administrator --password password --bucket {{.NthBucket 6}} --start 0 --end 1000000 --batch_size 100000 --file_path /sift_base.fvecs --load_in_chunks false --base64_encoding true"
  alias: vector_mutations_7
- command: "--connection_string {{.Orchestrator}} --username Administrator --password password --bucket {{.NthBucket 7}} --start 0 --end 1000000 --batch_size 100000 --file_path /sift_base.fvecs --load_in_chunks false --xattrs true"
  alias: vector_mutations_8
- command: "--connection_string {{.Orchestrator}} --username Administrator --password password --bucket {{.NthBucket 11}} --start 0 --end 1000000 --batch_size 100000 --file_path /sift_base.fvecs --load_in_chunks false"
  alias: vector_mutations_12
  wait: true


############ sleep before sparse embeddings upsert ################
- image: sequoiatools/cmd
  entrypoint: sleep
  command: "180"
  wait: true

############ upsert sparse embeddings for bucket12 ################
- image: sequoiatools/vectorloader
  command: "--connstr couchbase://{{.Orchestrator}} --username Administrator --password password --bucket {{.NthBucket 11}} --scope _default --collection _default --num-docs 1000000"
  volumes: "/data/sparseSIFT/:/app/embeddings"
  alias: sparse_mutations_12

############ wait for a while ################
- image: sequoiatools/cmd
  entrypoint: sleep
  command: "1800"
  wait: true

- image: sequoiatools/siftloader
  command: "--connection_string {{.Orchestrator}} --username Administrator --password password --bucket {{.NthBucket 1}} --start 1 --end 1000000 --batch_size 100000 --file_path /gist_base.fvecs --load_in_chunks false"
- command: "--connection_string {{.Orchestrator}} --username Administrator --password password --bucket {{.NthBucket 1}} --start 1 --end 1000000 --batch_size 100000 --file_path /gist_base.fvecs --load_in_chunks false --scope scope_0 --collection coll_0"

############ wait for a while ################
- image: sequoiatools/cmd
  entrypoint: sleep
  command: "3600"
  wait: true

- client:
    op: rm
    container: vector_mutations_1
- client:
    op: rm
    container: vector_mutations_9
- client:
    op: rm
    container: vector_mutations_3
- client:
    op: rm
    container: vector_mutations_4
- client:
    op: rm
    container: vector_mutations_5
- client:
    op: rm
    container: vector_mutations_6
- client:
    op: rm
    container: vector_mutations_7
- client:
    op: rm
    container: vector_mutations_10

###############  create indexes (batch 1: scalar + small-bucket BHIVE) ################
##### small-bucket BHIVE sets (bucket2, bucket7, bucket12) are created and built here, not in batch 2 below,
##### so batch 2 isn't building 4+ BHIVE sets concurrently. bucket9's 50M BHIVE stays in batch 2 - it's not small.
- section_start: create_replica_indexes
- image: sequoiatools/indexmanager
  command: "-n {{.Orchestrator}} -o {{.RestPort}} -u {{.RestUsername}} -p {{.RestPassword}} --bucket_list {{.Bucket}} -i {{.Scale 1}} -a create_n_indexes_on_buckets --set_max_partitions 24 -v --num_of_indexes_per_bucket 13 --skip_default_collection true"
  wait: true
- command: "-n {{.Orchestrator}} -o {{.RestPort}} -u {{.RestUsername}} -p {{.RestPassword}} --bucket_list {{.NthBucket 1}} -i {{.Scale 1}} -a create_n_indexes_on_buckets --set_max_partitions 24 -v --num_of_indexes_per_bucket 13 --skip_default_collection true --set_max_replicas 1"
  wait: true
- command: "-n {{.Orchestrator}} -o {{.RestPort}} -u {{.RestUsername}} -p {{.RestPassword}} --bucket_list {{.NthBucket 11}} -i {{.Scale 1}} -a create_n_indexes_on_buckets --set_max_partitions 24 -v --num_of_indexes_per_bucket 13 --skip_default_collection false --set_max_replicas 0"
  wait: true
- command: "-n {{.Orchestrator}} -o {{.RestPort}} -u {{.RestUsername}} -p {{.RestPassword}} --bucket_list {{.NthBucket 2}} -i {{.Scale 1}} -a create_n_indexes_on_buckets --set_max_partitions 24 -v --num_of_indexes_per_bucket 13 --skip_default_collection false --set_max_replicas 1"
  wait: true
############### bucket2 BHIVE vector indexes (small - 1M vectors, moved from batch 2) ################
- command: "-n {{.Orchestrator}} -o {{.RestPort}} -u {{.RestUsername}} -p {{.RestPassword}} --bucket_list {{.NthBucket 1}}  -a create_n_indexes_on_buckets --timeout 30  -v --num_of_indexes_per_bucket 4  --create_bhive_indexes true --num_dimensions 960 --skip_default_collection false --num_vectors 1000000 --distance_algo DOT --use_description IVF1000,RaBitQ --set_max_partitions 8"
  wait: true
############### bucket7 BHIVE vector indexes (small - 1M vectors, moved from batch 2) ################
- command: "-n {{.Orchestrator}} -o {{.RestPort}} -u {{.RestUsername}} -p {{.RestPassword}} --bucket_list {{.NthBucket 6}}  -a create_n_indexes_on_buckets --timeout 30  -v --num_of_indexes_per_bucket 4  --create_bhive_indexes true --num_dimensions 128 --skip_default_collection false --num_vectors 1000000 --distance_algo L2 --base64_encoding_vectors true --use_description IVF1000 --set_max_partitions 8"
  wait: true
############### bucket12 BHIVE vector indexes (small - 1M vectors, moved from batch 2) ################
- command: "-n {{.Orchestrator}} -o {{.RestPort}} -u {{.RestUsername}} -p {{.RestPassword}} --bucket_list {{.NthBucket 11}} -a create_n_indexes_on_buckets --timeout 30  -v --num_of_indexes_per_bucket 2  --create_bhive_indexes true --num_dimensions 128 --skip_default_collection false --num_vectors 1000000 --distance_algo DOT --use_description IVF1000,RaBitQ --set_max_replicas 1 --set_max_partitions 8"
  wait: true
############### bucket12 sparse BHIVE indexes (small - 1M vectors, moved from batch 2) ################
- command: "-n {{.Orchestrator}} -o {{.RestPort}} -u {{.RestUsername}} -p {{.RestPassword}} --bucket_list {{.NthBucket 11}} -a create_n_indexes_on_buckets --timeout 30 --num_of_indexes_per_bucket 4 --create_sparse_bhive_indexes true --skip_default_collection false --num_vectors 1000000 --set_max_replicas 1 --use_description IVF1000 --set_max_partitions 8"
  wait: true

############### build + wait paired with the batch just created (bucket1, bucket2, bucket12, bucket3 scalar + bucket2, bucket7, bucket12 small BHIVE) - create_n_indexes_on_buckets randomly defers ~50% of indexes even without --defer_build, so build_deferred_index must be issued for every bucket just created before the wait, or the wait can hang on indexes nobody told to build ################
- image: sequoiatools/indexmanager
  command: "-n {{.Orchestrator}} -o {{.RestPort}} -u {{.RestUsername}} -p {{.RestPassword}} -b {{.Bucket}} -a build_deferred_index -m 5"
  wait: true
- command: "-n {{.Orchestrator}} -o {{.RestPort}} -u {{.RestUsername}} -p {{.RestPassword}} -b {{.NthBucket 1}} -a build_deferred_index -m 5"
  wait: true
- command: "-n {{.Orchestrator}} -o {{.RestPort}} -u {{.RestUsername}} -p {{.RestPassword}} -b {{.NthBucket 11}} -a build_deferred_index -m 5"
  wait: true
- command: "-n {{.Orchestrator}} -o {{.RestPort}} -u {{.RestUsername}} -p {{.RestPassword}} -b {{.NthBucket 2}} -a build_deferred_index -m 5"
  wait: true
- command: "-n {{.Orchestrator}} -o {{.RestPort}} -u {{.RestUsername}} -p {{.RestPassword}} -b {{.NthBucket 6}} -a build_deferred_index -m 5"
  wait: true
- image: sequoiatools/wait_for_idx_build_complete
  command: "{{.ActiveIndexNode 0}} {{.RestUsername}} {{.RestPassword}}"
  wait: true

###############  create indexes (batch 2: remaining big/dense vector sets) ################
