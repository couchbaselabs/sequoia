  wait: true


- template: rebalance_out
  args: "({{.ActiveIndexNode 1}})"
  wait: true

# Sleep before starting to poll for rebalance progress
- image: sequoiatools/cmd
  entrypoint: sleep
  command: "430"
  wait: true

# Wait for rebalance to complete
- template: wait_for_rebalance
  wait: true

# Safety wait: hold 10 min after rebalance completion so the index/service
# rebalance phase fully settles before validation / item_count_check
- image: sequoiatools/cmd
  entrypoint: sleep
  command: "600"
  wait: true

############### Validate no index loss after rebalance #37 ################
- image: sequoiatools/indexmanager
  command: "-n {{.Orchestrator}} -o {{.RestPort}} -u {{.RestUsername}} -p {{.RestPassword}} -a validate_index_names --snapshot_file /data/index_snapshot_37.json"
  volumes: "/data:/data"
  wait: true

############### Item count check on big buckets (50M: bucket6/bucket9, sparse 8.8M: bucket11/bucket5) and scalar-only bucket3 after this rebalance ################
- image: sequoiatools/indexmanager
  command: "-n {{.Orchestrator}} -o {{.RestPort}} -u {{.RestUsername}} -p {{.RestPassword}} -b {{.NthBucket 5}} -a item_count_check --dataset shoes --sample_size 5 --all_docs_indexed true"
  wait: true
- command: "-n {{.Orchestrator}} -o {{.RestPort}} -u {{.RestUsername}} -p {{.RestPassword}} -b {{.NthBucket 8}} -a item_count_check --dataset shoes --sample_size 5 --all_docs_indexed true"
  wait: true
- command: "-n {{.Orchestrator}} -o {{.RestPort}} -u {{.RestUsername}} -p {{.RestPassword}} -b {{.NthBucket 10}} -a item_count_check --dataset shoes --sample_size 5 --all_docs_indexed true"
  wait: true
- command: "-n {{.Orchestrator}} -o {{.RestPort}} -u {{.RestUsername}} -p {{.RestPassword}} -b {{.NthBucket 4}} -a item_count_check --dataset shoes --sample_size 5 --all_docs_indexed true"
  wait: true
- command: "-n {{.Orchestrator}} -o {{.RestPort}} -u {{.RestUsername}} -p {{.RestPassword}} -b {{.NthBucket 2}} -a item_count_check --sample_size 5 --all_docs_indexed true"
  wait: true

